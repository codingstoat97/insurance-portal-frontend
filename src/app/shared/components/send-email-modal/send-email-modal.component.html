<div class="send-email-modal">
    <mat-dialog-content>
        <div class="modal-title">
            <mat-icon fontIcon="email"></mat-icon>
            <h4>Enviar Plan por Correo</h4>
        </div>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="email-field">
                <mat-label>Correo electrónico</mat-label>
                <input matInput type="email" formControlName="email" placeholder="cliente@correo.com" />
                <mat-error *ngIf="form.get('email')?.hasError('required')">
                    El correo es obligatorio
                </mat-error>
                <mat-error *ngIf="form.get('email')?.hasError('email')">
                    Ingrese un correo válido
                </mat-error>
            </mat-form-field>
        </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button (click)="closeModal()">Cancelar</button>
        <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="onSubmit()">Enviar</button>
    </mat-dialog-actions>
</div>
