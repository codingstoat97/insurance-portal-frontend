<div class="table-container">
    <div class="table-title" *ngIf="title">
        <h2>{{ title }}</h2>
    </div>
    <div class="table-toolbar">
        <div class="toolbar-left">
            <mat-form-field *ngIf="!columnFilters">
                <mat-label>Filtrar</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Ingrese filtro" #input>
            </mat-form-field>
        </div>
        <div class="toolbar-right">
            <button *ngIf="columnFilters && isMobile" mat-stroked-button type="button"
                (click)="openFilterSheet()">
                <mat-icon>filter_list</mat-icon>
                Filtros
                <span *ngIf="activeColumnFilterCount" class="filter-count-badge">{{ activeColumnFilterCount }}</span>
            </button>
            <button *ngIf="columnFilters && !isMobile && hasActiveColumnFilters" mat-button type="button"
                (click)="clearAllColumnFilters()">
                <mat-icon>filter_alt_off</mat-icon>
                Limpiar filtros
            </button>
            <button *ngIf="addElement" mat-stroked-button (click)="onAddNewElement()">
                <mat-icon>add</mat-icon>
                Crear Nuevo
            </button>
        </div>
    </div>

    <div class="column-filter-bar" *ngIf="columnFilters && !isMobile">
        <mat-icon class="column-filter-bar__icon">filter_list</mat-icon>
        <mat-form-field class="column-filter" *ngFor="let col of filterableColumns" subscriptSizing="dynamic">
            <input matInput [value]="columnFilterValues[col.id] || ''"
                (keyup)="applyColumnFilter(col.id, $event)"
                [placeholder]="col.header || col.id">
            <button *ngIf="columnFilterValues[col.id]" matSuffix mat-icon-button type="button"
                aria-label="Limpiar" (click)="clearColumnFilter(col.id)">
                <mat-icon>close</mat-icon>
            </button>
        </mat-form-field>
    </div>

    <ng-template #filterSheet>
        <div class="filter-sheet">
            <div class="filter-sheet__header">
                <h3>Filtros</h3>
                <button mat-icon-button type="button" aria-label="Cerrar" (click)="closeFilterSheet()">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
            <div class="filter-sheet__fields">
                <mat-form-field class="filter-sheet__field" *ngFor="let col of filterableColumns" subscriptSizing="dynamic">
                    <mat-label>{{ col.header || col.id }}</mat-label>
                    <input matInput [value]="columnFilterValues[col.id] || ''"
                        (keyup)="applyColumnFilter(col.id, $event)">
                    <button *ngIf="columnFilterValues[col.id]" matSuffix mat-icon-button type="button"
                        aria-label="Limpiar" (click)="clearColumnFilter(col.id)">
                        <mat-icon>close</mat-icon>
                    </button>
                </mat-form-field>
            </div>
            <div class="filter-sheet__actions">
                <button mat-button type="button" [disabled]="!hasActiveColumnFilters"
                    (click)="clearAllColumnFilters()">
                    Limpiar todo
                </button>
                <button mat-flat-button color="primary" type="button" (click)="closeFilterSheet()">
                    Aplicar
                </button>
            </div>
        </div>
    </ng-template>

    <div class="mat-elevation-z8">
        <div class="table-scroll-wrapper" *ngIf="!isMobile; else mobileCards">
        <table mat-table [dataSource]="dataSource">
            <ng-container *ngFor="let col of columns" [matColumnDef]="col.id">
                <th mat-header-cell *matHeaderCellDef>
                    {{ col.header || col.id }}
                </th>

                <td mat-cell *matCellDef="let row">
                    <mat-icon *ngIf="col.iconGetter as getIcon; else plainValue"
                        [style.color]="getIcon(row)?.color">{{ getIcon(row)?.icon }}</mat-icon>
                    <ng-template #plainValue>
                        {{ col.valueGetter ? col.valueGetter(row) : row[col.field || col.id] }}
                    </ng-template>
                </td>
            </ng-container>

            <ng-container *ngIf="actions.length" matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let row">
                    <div class="action-buttons">
                        <button mat-icon-button *ngFor="let a of actions" [disabled]="a.disabled?.(row)"
                            [color]="a.color" (click)="onAction(a, row, $event)" [matTooltip]="a.tooltip">
                            <mat-icon>{{ a.icon }}</mat-icon>
                        </button>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="no-data" [attr.colspan]="columns.length || 1">Sin datos</td>
            </tr>
        </table>

        </div>
        <ng-template #mobileCards>
            <app-data-card-list [rows]="(dataSource.connect() | async) ?? []" [columns]="columns"
                [actions]="actions" (action)="action.emit($event)"></app-data-card-list>
        </ng-template>
        <mat-paginator panelClass="paginator-panel" [pageSizeOptions]="[10, 25, 100]"></mat-paginator>
    </div>
</div>
