<div class="form-container dialog-form-container">
    <div class="form-title">
        <h3>{{title}}</h3>
        <p *ngIf="showDescription">{{ description }}</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="field-container">
        <div class="form-section">
            <h4 class="section-title">
                <mat-icon>directions_car</mat-icon>
                Datos del Vehículo
            </h4>
            <div class="form-grid">
                <mat-form-field appearance="outline">
                    <mat-label>Marca</mat-label>
                    <input matInput formControlName="brand" placeholder="Ej. Honda" />
                    <mat-error *ngIf="form.get('brand')?.hasError('required')">
                        La marca del vehículo es obligatoria
                    </mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Modelo</mat-label>
                    <input matInput formControlName="model" placeholder="Ej. Civic" />
                    <mat-error *ngIf="form.get('model')?.hasError('required')">
                        El modelo es obligatorio
                    </mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Alta Gama:</mat-label>
                    <mat-select formControlName="highEnd">
                        <mat-option [value]="true">
                            Sí
                        </mat-option>
                        <mat-option [value]="false">
                            No
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Tipo de Vehículo:</mat-label>
                    <mat-select formControlName="vehicleType">
                        <mat-option *ngFor="let vt of vehicleTypeList" [value]="vt.name">
                            {{ vt.name }}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="form.get('vehicleType')?.hasError('required')">
                        Selecciona un tipo de vehículo
                    </mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Tipo de Motor:</mat-label>
                    <mat-select formControlName="engineType">
                        <mat-option *ngFor="let et of engineTypeList" [value]="et">
                            {{ et }}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="form.get('engineType')?.hasError('required')">
                        Selecciona un tipo de motor
                    </mat-error>
                </mat-form-field>
            </div>
        </div>

        <div class="form-actions">
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
                {{ submitLabel }}
            </button>

            <button *ngIf="showCancel" mat-stroked-button color="warn" type="button" (click)="onCancel()">
                Cancelar
            </button>
        </div>
    </form>
</div>
