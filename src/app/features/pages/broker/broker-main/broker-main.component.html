<mat-drawer-container class="page-container">
    <mat-drawer *ngIf="!isMobile" #drawer mode="side" opened class="drawer-container">
        <app-user-profile [username]="username" [profilePictureURL]="profilePictureURL"
            [showOccupation]="true" [profileOptions]="profileOptions"></app-user-profile>
    </mat-drawer>
    <mat-drawer-content>
        <div class="page-header">
            <ng-container *ngIf="!isMobile">
                <h2>Hola, {{ username }}</h2>
                <p>Administra tus planes de seguro en esta sección.</p>
            </ng-container>
            <div class="mobile-profile" *ngIf="isMobile">
                <img class="mobile-avatar" [src]="profilePictureURL" alt="Foto de perfil" />
                <span class="mobile-greeting">Hola, {{ username }}</span>
                <button mat-icon-button [matMenuTriggerFor]="mobileMenu" aria-label="Mi Perfil">
                    <mat-icon>account_circle</mat-icon>
                </button>
                <mat-menu #mobileMenu>
                    <button mat-menu-item (click)="openEditProfileDialog()">
                        <mat-icon>person</mat-icon>
                        Editar Perfil
                    </button>
                    <button mat-menu-item (click)="logout()">
                        <mat-icon>logout</mat-icon>
                        Cerrar Sesión
                    </button>
                </mat-menu>
            </div>
        </div>
        <div class="tab-container">
            <mat-tab-group>
                <mat-tab label="Condiciones">
                    <app-data-table [rows]="planRows" [columns]="planColumns" [actions]="planActions" [addElement]="true"
                        (action)="onPlanRowAction('Plan', $event)"
                        (addNewElementAction)="onAddNewElement('Plan')"></app-data-table>
                </mat-tab>
                <mat-tab label="Coberturas Principales">
                    <app-data-table [rows]="benefitRows" [columns]="benefitColumns" [actions]="actions"
                        [addElement]="true" (action)="onRowAction('Benefit', $event)"
                        (addNewElementAction)="onAddNewElement('Benefit')"></app-data-table>
                </mat-tab>
                <mat-tab label="Beneficios">
                    <app-data-table [rows]="benefitRows" [columns]="benefitColumns" [actions]="actions"
                        [addElement]="true" (action)="onRowAction('Benefit', $event)"
                        (addNewElementAction)="onAddNewElement('Benefit')"></app-data-table>
                </mat-tab>
                <mat-tab label="Aprobación de Pólizas">
                    <mat-tab-group class="approval-tab-group">
                        <mat-tab label="Pendientes">
                            <app-data-table [rows]="waitingListRows" [columns]="approvalColumns"
                                [actions]="waitingListActions" (action)="onWaitingListRowAction($event)"></app-data-table>
                        </mat-tab>
                        <mat-tab label="Aprobadas">
                            <app-data-table [rows]="soldPlanRows" [columns]="approvalColumns"></app-data-table>
                        </mat-tab>
                    </mat-tab-group>
                </mat-tab>
            </mat-tab-group>
        </div>
    </mat-drawer-content>
</mat-drawer-container>

<ng-template #profileOptions>
    <mat-list>
        <mat-list-item (click)="openEditProfileDialog()">
            <mat-icon matListItemIcon>person</mat-icon>
            <div matListItemTitle>Editar Perfil</div>
        </mat-list-item>
    </mat-list>
</ng-template>
